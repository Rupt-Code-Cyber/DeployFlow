services:
  api:
    container_name: deployflow_api_prod
    image: deployflow:prod
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=${REDIS_URL}
    networks:
      - deployflow-frontend-network
      - deployflow-backend-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    container_name: deployflow_postgres_prod
    image: postgres:16.4-alpine
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - deployflow_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - deployflow-backend-network

  redis:
    container_name: deployflow_redis_prod
    image: redis:7.4-alpine
    restart: always
    volumes:
      - deployflow_prod_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - deployflow-backend-network

networks:
  deployflow-frontend-network:
    driver: bridge
    name: deployflow_frontend_network
  deployflow-backend-network:
    driver: bridge
    internal: true
    name: deployflow_backend_network

volumes:
  deployflow_prod_postgres_data:
    name: deployflow_prod_postgres_data
  deployflow_prod_redis_data:
    name: deployflow_prod_redis_data
